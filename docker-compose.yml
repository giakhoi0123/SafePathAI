services:
  postgis:
    image: postgis/postgis:15-3.3
    container_name: safepath-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: safepath_db
      POSTGRES_USER: safepath_user
      POSTGRES_PASSWORD: safepath_password
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safepath_user -d safepath_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - safepath-net

  redis:
    image: redis:7-alpine
    container_name: safepath-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - safepath-net

  osrm:
    image: osrm/osrm-backend@sha256:af5d4a83fb90086a43b1ae2ca22872e6768766ad5fcbb07a29ff90ec644ee409
    container_name: safepath-osrm
    restart: unless-stopped
    ports:
      - "${OSRM_HOST_PORT:-5000}:5000"
    volumes:
      - ./data/osrm:/data:ro
      - ./scripts/osrm_healthcheck.sh:/opt/osrm_healthcheck.sh:ro
    command: osrm-routed --algorithm mld /data/vietnam-latest.osrm
    healthcheck:
      test: ["CMD", "bash", "/opt/osrm_healthcheck.sh"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 120s
    networks:
      - safepath-net

  osm-import:
    profiles: ["tools"]
    image: iboates/osm2pgsql@sha256:6548a1e2492e08fa0d5ce987d382ad57c4b21c8a94ff00017c6109770a061b79
    environment:
      PGHOST: postgis
      PGPORT: 5432
      PGUSER: safepath_user
      PGPASSWORD: safepath_password
    volumes:
      - ./data/osrm:/data:ro
      - ./scripts/osm_roads.lua:/style.lua:ro
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - safepath-net

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: safepath-backend:latest
    container_name: safepath-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://safepath_user:safepath_password@postgis:5432/safepath_db
      REDIS_URL: redis://redis:6379/0
      OSRM_BASE_URL: http://osrm:5000
      YOLO_MODEL_PATH: data/models/yolo26n.onnx
      CAMERA_SCRAPE_INTERVAL_SEC: "60"
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm:
        condition: service_healthy
    networks:
      - safepath-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: safepath-frontend:latest
    container_name: safepath-frontend
    restart: unless-stopped
    environment:
      INTERNAL_BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      AUTH_SECRET: ${AUTH_SECRET:-safepath_default_auth_secret_dev_32char_key}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - safepath-net

volumes:
  postgis_data:
    name: safepath_postgis_data
  redis_data:
    name: safepath_redis_data

networks:
  safepath-net:
    driver: bridge

